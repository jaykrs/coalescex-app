name: elearning_mobile
description: Flutter client for the Northfield eLearning platform (shares the REST API with the Next.js web app).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Secure, OS-backed storage for the refresh token:
  #  - iOS: Keychain (kSecClassGenericPassword)
  #  - Android: EncryptedSharedPreferences, backed by the Android Keystore
  flutter_secure_storage: ^9.2.2

  # HTTP client with a clean interceptor API for auto-attaching/refreshing tokens
  dio: ^5.7.0

  # State management for auth session
  flutter_riverpod: ^2.6.1

  # Optional: gate app resume behind device biometrics/PIN before showing content
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
